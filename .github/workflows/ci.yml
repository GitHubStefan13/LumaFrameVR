name: build and test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libvulkan-dev mesa-vulkan-drivers \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev \
            libpulse-dev libopenxr-dev glslc

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGLSLC_EXECUTABLE="$(command -v glslc)"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        # The suite runs without a headset, a VPU, Steam or a media fixture: the tests that need
        # those report themselves as skipped rather than passing on nothing.
        run: ctest --test-dir build --output-on-failure

      - name: Installer acceptance tests
        run: python3 -B -m unittest discover -s installer/tests -v
