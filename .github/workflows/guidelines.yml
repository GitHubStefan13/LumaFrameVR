name: guidelines

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the same clang-format the tree was formatted with
        # Pinned on purpose. A different clang-format version reformats differently, so an unpinned
        # one would fail a tree that is already correct.
        run: python3 -m pip install --quiet 'clang-format==23.1.3'

      - name: Check the C and C++ against .clang-format
        run: clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.hpp' '*.c' '*.h')
